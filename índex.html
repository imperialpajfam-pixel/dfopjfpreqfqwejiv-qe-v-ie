<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Cuentas</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#8e8e93;--sep:rgba(60,60,67,.16);--blue:#007aff;--green:#34c759;--red:#ff3b30;--purple:#af52de;--seg:rgba(118,118,128,.12);--bar:rgba(249,249,249,.82)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:rgba(84,84,88,.55);--blue:#0a84ff;--green:#30d158;--red:#ff453a;--purple:#bf5af2;--seg:rgba(118,118,128,.24);--bar:rgba(29,29,31,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(150px + env(safe-area-inset-bottom,0px))}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.2px;margin:8px 4px 14px}
h2{font-size:13px;font-weight:400;color:var(--tx2);margin:22px 16px 6px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--seg);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:6px 4px;border-radius:7px;font-size:13px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media(prefers-color-scheme:dark){.seg button.on{background:#636366}}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px}
.nav .t{font-weight:600;text-align:center;flex:1}
.nav button{color:var(--blue);font-size:22px;width:44px;height:36px;line-height:1}
.nav button:disabled{opacity:.3}
.hoy{display:block;margin:-4px auto 8px;color:var(--blue);font-size:15px}
.card{background:var(--card);border-radius:16px;padding:16px}
.big{font-size:40px;font-weight:700;letter-spacing:.3px;line-height:1.1}
.lbl{font-size:13px;color:var(--tx2)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:.5px solid var(--sep)}
.trio b{display:block;font-size:17px;font-weight:600;margin-top:2px;color:var(--tx)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ch{margin:14px 2px 4px;min-height:58px}
.ch .s{font-size:13px;color:var(--tx2)}
.ch .v{font-size:30px;font-weight:700;letter-spacing:.3px;line-height:1.15}
svg{width:100%;height:auto;display:block}
.ax{font-size:10px;fill:var(--tx2)}.ax.cur{fill:var(--tx);font-weight:600}.ax.on{fill:var(--tx);font-weight:700}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:64px;border-top:.5px solid var(--sep)}
.emo{width:36px;height:36px;border-radius:10px;background:var(--seg);display:grid;place-items:center;font-size:20px;flex:none}
.row .m{flex:1;min-width:0}.row .m div:first-child{font-size:17px}
.row .m div+div{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-variant-numeric:tabular-nums;font-size:17px}
.cat{padding:10px 16px}.cat+.cat{border-top:.5px solid var(--sep)}
.cat .h{display:flex;align-items:center;gap:10px}
.cat .h .n{flex:1}.cat .h .p{color:var(--tx2);font-size:13px}
.cat .bar{height:5px;border-radius:3px;background:var(--seg);margin:8px 0 0 46px;overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:3px}
.empty{text-align:center;color:var(--tx2);padding:40px 24px;font-size:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--tx2)}
.tabs button.on{color:var(--blue)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.fab{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--tx);color:var(--bg);font-size:32px;font-weight:300;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:6;display:grid;place-items:center;line-height:1;padding-bottom:3px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:16px 16px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:92%;overflow:auto}
.ov.open .sheet{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 0 14px}
.sh b{font-size:17px}.sh button{color:var(--blue);font-size:17px}.sh .ok{font-weight:600}
.field{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;gap:12px}
.field+.field,.cats+.field,.field+.cats{border-top:.5px solid var(--sep)}
.field input{font:inherit;color:var(--tx);background:none;border:0;text-align:right;outline:none;min-width:0;flex:1}
.field input.err{color:var(--red)}
.amt{font-size:34px!important;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;background:var(--seg);font-size:11px;border:2px solid transparent}
.cats button span:first-child{font-size:24px;line-height:1.1}
.cats button.on{border-color:var(--tx);background:var(--card)}
.danger{display:block;width:100%;margin-top:18px;padding:13px;background:var(--card);border-radius:12px;color:var(--red);text-align:center}
.link{display:block;width:100%;padding:12px 16px;text-align:left;color:var(--blue)}
.link+.link{border-top:.5px solid var(--sep)}
.foot{font-size:13px;color:var(--tx2);margin:8px 16px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" data-a="add" aria-label="Agregar movimiento">+</button>
<nav class="tabs">
  <button data-a="tab" data-v="res"><svg viewBox="0 0 26 26"><path d="M6 21V13M13 21V5M20 21v-6"/></svg>Resumen</button>
  <button data-a="tab" data-v="mov"><svg viewBox="0 0 26 26"><path d="M5 7h16M5 13h16M5 19h10"/></svg>Movimientos</button>
  <button data-a="tab" data-v="set"><svg viewBox="0 0 26 26"><path d="M5 8h16M5 18h16"/><circle cx="9" cy="8" r="2.4" fill="var(--bg)"/><circle cx="17" cy="18" r="2.4" fill="var(--bg)"/></svg>Ajustes</button>
</nav>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TYPES={ingreso:{n:'Ingresos',s:'Ingreso',c:'--green'},gasto:{n:'Gastos',s:'Gasto',c:'--red'},inversion:{n:'Inversión',s:'Inversión',c:'--purple'}};
const CATS={
  gasto:['Comida','Transporte','Casa','Servicios','Salud','Ocio','Compras','Otros'],
  ingreso:['Sueldo','Freelance','Ventas','Regalo','Otros'],
  inversion:['Cetes','Acciones','Fondos','Cripto','Ahorro','Otros']};
const EMO={Comida:'🍽️',Transporte:'🚗',Casa:'🏠',Servicios:'💡',Salud:'💊',Ocio:'🎬',Compras:'🛍️',Sueldo:'💼',Freelance:'💻',Ventas:'🏷️',Regalo:'🎁',Cetes:'🏛️',Acciones:'📈',Fondos:'🏦',Cripto:'🪙',Ahorro:'🐷',Otros:'✨'};
const emo=c=>EMO[c]||'✨';
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['L','M','M','J','V','S','D'];
const K='cuentas.v1';
const load=()=>{try{const v=JSON.parse(localStorage.getItem(K));return Array.isArray(v)?v:[]}catch{return[]}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(tx))}catch{}};
let tx=load();
let S={tab:'res',mode:'sem',off:0,filter:'all',metric:'gasto',sel:null};
let D=null;

const money=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const money2=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap1=s=>s[0].toUpperCase()+s.slice(1);
const short=v=>v>=1e6?(v/1e6).toFixed(1).replace('.0','')+'M':v>=1e3?(v/1e3).toFixed(1).replace('.0','')+'k':String(Math.round(v));
const niceMax=v=>{const p=10**Math.floor(Math.log10(v)),m=v/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p};

function sums(from,to){
  const r={ingreso:0,gasto:0,inversion:0};
  for(const t of tx) if(t.date>=from&&t.date<=to) r[t.type]+=t.amount;
  return r;
}

function period(){
  const today=new Date(), tk=key(today);
  if(S.mode==='sem'){
    const st=addDays(monday(today),S.off*7), en=addDays(st,6);
    const groups=[0,1,2,3,4,5,6].map(i=>{const d=addDays(st,i),k=key(d);
      return{label:DIA[i],long:cap1(d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})),cur:k===tk,...sums(k,k)}});
    const title=st.getMonth()===en.getMonth()?`${st.getDate()} – ${en.getDate()} ${MES[en.getMonth()]}`:`${st.getDate()} ${MES[st.getMonth()]} – ${en.getDate()} ${MES[en.getMonth()]}`;
    return{groups,title:title+' '+en.getFullYear(),from:key(st),to:key(en),sum:sums(key(st),key(en))};
  }
  const base=new Date(today.getFullYear(),today.getMonth()+S.off,1);
  const groups=[-5,-4,-3,-2,-1,0].map(i=>{
    const a=new Date(base.getFullYear(),base.getMonth()+i,1),b=new Date(a.getFullYear(),a.getMonth()+1,0);
    return{label:MES[a.getMonth()],long:cap1(a.toLocaleDateString('es-MX',{month:'long',year:'numeric'})),cur:i===0,...sums(key(a),key(b))};
  });
  const a=base,b=new Date(a.getFullYear(),a.getMonth()+1,0);
  return{groups,title:cap1(a.toLocaleDateString('es-MX',{month:'long',year:'numeric'})),from:key(a),to:key(b),sum:sums(key(a),key(b))};
}

/* Gráfica estilo Apple Salud: una métrica, barras con tapa redondeada, selección al tocar */
function capPath(x,y,w,h){const r=Math.min(w*.32,h);return`M${x} ${y+h}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h}Z`}
function chart(g,M,avg,sel){
  const W=340,H=200,L=2,R=34,B=24,T=10;
  const max=Math.max(1,...g.map(x=>x[M])),nice=niceMax(max);
  const iw=W-L-R,ih=H-B-T,gw=iw/g.length,bw=Math.min(26,gw*.5),col=`var(${TYPES[M].c})`;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de barras de ${TYPES[M].n.toLowerCase()}">`;
  [0,.5,1].forEach(f=>{const y=T+ih-ih*f;
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--sep)" stroke-width="${f?.6:.9}" ${f?'stroke-dasharray="1.5 3.5" stroke-linecap="round"':''}/><text x="${W-R+7}" y="${y+3.5}" class="ax">${short(nice*f)}</text>`});
  g.forEach((x,i)=>{
    const cx=L+gw*i+gw/2,h=x[M]>0?Math.max(ih*x[M]/nice,3):0,dim=sel!=null&&sel!==i;
    if(h>0) s+=`<path d="${capPath(cx-bw/2,T+ih-h,bw,h)}" fill="${col}" opacity="${dim?.28:1}"/>`;
    s+=`<text x="${cx}" y="${H-7}" text-anchor="middle" class="ax${x.cur?' cur':''}${sel===i?' on':''}">${x.label}</text>`;
  });
  if(avg>0&&sel==null){const y=T+ih-ih*Math.min(avg/nice,1);
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--tx2)" stroke-width=".9" stroke-dasharray="4 3" opacity=".8"/>`}
  g.forEach((x,i)=>{s+=`<rect x="${L+gw*i}" y="0" width="${gw}" height="${H}" fill="transparent" data-a="sel" data-v="${i}" style="cursor:pointer"/>`});
  return s+'</svg>';
}

function vRes(){
  const p=period(),s=p.sum,disp=s.ingreso-s.gasto-s.inversion,M=S.metric,g=p.groups;
  const total=g.reduce((a,x)=>a+x[M],0),avg=total/g.length,sel=S.sel!=null?g[S.sel]:null;
  const head=sel
    ?`<div class="s">${sel.long}</div><div class="v">${money.format(sel[M])}</div>`
    :`<div class="s">${S.mode==='sem'?'Total de la semana':'Total de 6 meses'} · promedio ${money.format(avg)} por ${S.mode==='sem'?'día':'mes'}</div><div class="v">${money.format(total)}</div>`;
  const cats={};
  tx.filter(t=>t.type===M&&t.date>=p.from&&t.date<=p.to).forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amount);
  const list=Object.entries(cats).sort((a,b)=>b[1]-a[1]),sum=list.reduce((a,[,v])=>a+v,0),top=list[0]?list[0][1]:1;
  return `<h1>Resumen</h1>
  <div class="seg"><button data-a="mode" data-v="sem" class="${S.mode==='sem'?'on':''}">Semana</button><button data-a="mode" data-v="mes" class="${S.mode==='mes'?'on':''}">Mes</button></div>
  <div class="nav"><button data-a="nav" data-v="-1" aria-label="Anterior">‹</button><div class="t">${p.title}</div><button data-a="nav" data-v="1" ${S.off>=0?'disabled':''} aria-label="Siguiente">›</button></div>
  ${S.off!==0?'<button class="hoy" data-a="hoy">Volver a hoy</button>':''}
  <div class="card"><div class="lbl">Disponible</div><div class="big" style="color:var(${disp<0?'--red':'--tx'})">${money.format(disp)}</div>
    <div class="trio">
      <div class="lbl"><span class="dot" style="background:var(--green)"></span>Ingresos<b>${money.format(s.ingreso)}</b></div>
      <div class="lbl"><span class="dot" style="background:var(--red)"></span>Gastos<b>${money.format(s.gasto)}</b></div>
      <div class="lbl"><span class="dot" style="background:var(--purple)"></span>Inversión<b>${money.format(s.inversion)}</b></div>
    </div></div>
  <h2>Gráfica</h2>
  <div class="card">
    <div class="seg">${Object.entries(TYPES).map(([k,v])=>`<button data-a="metric" data-v="${k}" class="${M===k?'on':''}">${v.n}</button>`).join('')}</div>
    <div class="ch">${head}</div>
    ${chart(g,M,avg,S.sel)}
  </div>
  <h2>${TYPES[M].n} por categoría</h2>
  ${list.length?`<div class="list">${list.map(([c,v])=>`<div class="cat"><div class="h"><span class="emo">${emo(c)}</span><span class="n">${esc(c)}</span><span>${money.format(v)}</span><span class="p">${Math.round(v/sum*100)}%</span></div><div class="bar"><i style="width:${Math.max(4,v/top*100)}%;background:var(${TYPES[M].c})"></i></div></div>`).join('')}</div>`:`<div class="list"><div class="empty">Sin ${TYPES[M].n.toLowerCase()} en este periodo.</div></div>`}`;
}

function vMov(){
  const fs=[['all','Todo'],['ingreso','Ingresos'],['gasto','Gastos'],['inversion','Inversión']];
  const items=tx.filter(t=>S.filter==='all'||t.type===S.filter).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const byDay={};items.forEach(t=>(byDay[t.date]=byDay[t.date]||[]).push(t));
  const body=items.length?Object.entries(byDay).map(([d,arr])=>{
    const l=cap1(parse(d).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}));
    return `<h2>${l}</h2><div class="list">${arr.map(t=>
      `<button class="row" data-a="edit" data-v="${t.id}"><span class="emo">${emo(t.cat)}</span><span class="m"><div>${esc(t.cat)}</div>${t.note?`<div>${esc(t.note)}</div>`:''}</span><span class="a" style="color:var(${t.type==='ingreso'?'--green':t.type==='inversion'?'--purple':'--tx'})">${t.type==='ingreso'?'+':t.type==='gasto'?'−':''}${money2.format(t.amount)}</span></button>`).join('')}</div>`}).join('')
    :'<div class="empty">Aún no hay movimientos.<br>Toca + para registrar el primero.</div>';
  return `<h1>Movimientos</h1><div class="seg">${fs.map(([k,n])=>`<button data-a="filter" data-v="${k}" class="${S.filter===k?'on':''}">${n}</button>`).join('')}</div>${body}`;
}

function vSet(){
  return `<h1>Ajustes</h1>
  <h2>Respaldo</h2>
  <div class="list"><button class="link" data-a="export">Exportar copia de seguridad</button><button class="link" data-a="import">Importar copia de seguridad</button></div>
  <p class="foot">Tus datos se guardan solo en este teléfono. Exporta una copia de vez en cuando por si cambias de equipo o borras los datos del navegador.</p>
  <div class="list" style="margin-top:22px"><button class="link" style="color:var(--red)" data-a="wipe">Borrar todos los datos</button></div>
  <p class="foot">${tx.length} movimientos guardados.</p>`;
}

function render(){
  $('#app').innerHTML=S.tab==='res'?vRes():S.tab==='mov'?vMov():vSet();
  $$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tab));
  $('.fab').style.display=S.tab==='set'?'none':'grid';
}

/* ---------- Hoja para agregar / editar ---------- */
function readForm(){
  if(!D||!$('#f-amt')) return;
  D.amount=$('#f-amt').value;D.date=$('#f-date').value;D.note=$('#f-note').value;
}
function drawSheet(){
  const T=D.type;
  $('#sheet').innerHTML=`<div class="sh"><button data-a="close">Cancelar</button><b>${D.editing?'Editar':'Nuevo movimiento'}</b><button class="ok" data-a="save">Guardar</button></div>
  <div class="seg">${Object.entries(TYPES).map(([k,v])=>`<button data-a="type" data-v="${k}" class="${T===k?'on':''}">${v.s}</button>`).join('')}</div>
  <div class="list" style="margin-top:16px">
    <label class="field"><input id="f-amt" class="amt" inputmode="decimal" placeholder="$0" value="${esc(D.amount)}" autocomplete="off"></label>
    <div class="cats">${CATS[T].map(c=>`<button data-a="cat" data-v="${c}" class="${c===D.cat?'on':''}"><span>${emo(c)}</span><span>${c}</span></button>`).join('')}</div>
    <label class="field"><span>Fecha</span><input id="f-date" type="date" value="${D.date}"></label>
    <label class="field"><span>Nota</span><input id="f-note" placeholder="Opcional" value="${esc(D.note)}" maxlength="60"></label>
  </div>
  ${D.editing?'<button class="danger" data-a="del">Eliminar movimiento</button>':''}`;
}
function openSheet(id){
  const t=tx.find(x=>x.id===id);
  D=t?{...t,amount:String(t.amount),editing:true}:{type:'gasto',amount:'',cat:CATS.gasto[0],date:key(new Date()),note:'',editing:false};
  drawSheet();$('#ov').classList.add('open');
  if(!t) setTimeout(()=>$('#f-amt')&&$('#f-amt').focus(),300);
}
const closeSheet=()=>{$('#ov').classList.remove('open');D=null};

/* ---------- Acciones ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='ov') return closeSheet();
  const a=e.target.closest('[data-a]'); if(!a) return;
  const v=a.dataset.v;
  switch(a.dataset.a){
    case 'tab': S.tab=v;render();scrollTo(0,0);break;
    case 'mode': S.mode=v;S.off=0;S.sel=null;render();break;
    case 'nav': S.off=Math.min(0,S.off+Number(v));S.sel=null;render();break;
    case 'hoy': S.off=0;S.sel=null;render();break;
    case 'metric': S.metric=v;render();break;
    case 'sel': S.sel=S.sel===Number(v)?null:Number(v);render();break;
    case 'filter': S.filter=v;render();break;
    case 'add': openSheet();break;
    case 'edit': openSheet(v);break;
    case 'close': closeSheet();break;
    case 'type': readForm();D.type=v;D.cat=CATS[v][0];drawSheet();break;
    case 'cat': readForm();D.cat=v;drawSheet();break;
    case 'save': {
      readForm();
      const n=parseFloat(String(D.amount).replace(/[$,\s]/g,''));
      if(!(n>0)){$('#f-amt').classList.add('err');$('#f-amt').focus();return}
      const rec={id:D.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:D.type,amount:Math.round(n*100)/100,cat:D.cat,date:D.date||key(new Date()),note:D.note.trim()};
      const i=tx.findIndex(x=>x.id===rec.id); if(i>=0) tx[i]=rec; else tx.push(rec);
      save();closeSheet();render();break;
    }
    case 'del': if(confirm('¿Eliminar este movimiento?')){tx=tx.filter(x=>x.id!==D.id);save();closeSheet();render()}break;
    case 'export': {
      const b=new Blob([JSON.stringify(tx,null,2)],{type:'application/json'});
      const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='cuentas-respaldo-'+key(new Date())+'.json';l.click();
      setTimeout(()=>URL.revokeObjectURL(l.href),2000);break;
    }
    case 'import': $('#file').click();break;
    case 'wipe': if(confirm('Se borrarán todos tus movimientos. ¿Continuar?')){tx=[];save();render()}break;
  }
});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data)) throw 0;
    const ok=data.filter(t=>t&&TYPES[t.type]&&t.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)).map(t=>({id:String(t.id||Date.now()+Math.random()),type:t.type,amount:Number(t.amount),cat:String(t.cat||'Otros'),date:t.date,note:String(t.note||'')}));
    const map=new Map(tx.map(t=>[t.id,t])); ok.forEach(t=>map.set(t.id,t));
    tx=[...map.values()];save();render();alert(`Se importaron ${ok.length} movimientos.`);
  }catch{alert('El archivo no es una copia de seguridad válida.')}
  e.target.value='';
});

render();
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
